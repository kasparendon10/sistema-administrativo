<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Actualizar precios y novedades</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: sans-serif;
      background-color: #f0f0f0;
      padding: 20px;
    }
    .form-container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      background-color: #007BFF;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .success {
      color: green;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Actualizar precios o novedades</h2>
    <form id="precioForm">
      <label for="codigo">Código del producto</label>
      <input type="text" id="codigo" required>

      <label for="nombre">Nombre del producto</label>
      <input type="text" id="nombre" required>

      <label for="precioPunto">Precio punto</label>
      <input type="number" id="precioPunto" required>

      <label for="precioRestaurante">Precio restaurante</label>
      <input type="number" id="precioRestaurante" required>

      <label for="precioCaja">Precio por cajas</label>
      <input type="number" id="precioCaja" required>

      <label for="observacion">Observación</label>
      <textarea id="observacion" rows="3"></textarea>

      <button type="submit">Guardar actualización</button>
      <div class="success" id="mensaje"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('precioForm');
    const mensaje = document.getElementById('mensaje');

    form.addEventListener('submit', async function(e) {
  e.preventDefault();

  const data = {
    tipo: 'actualizacion_precios',
    codigo: document.getElementById('codigo').value,
    nombre: document.getElementById('nombre').value,
    precioPunto: document.getElementById('precioPunto').value,
    precioRestaurante: document.getElementById('precioRestaurante').value,
    precioCaja: document.getElementById('precioCaja').value,
    observacion: document.getElementById('observacion').value
  };

  try {
    await fetch("https://script.google.com/macros/s/AKfycbx1eDQuLvtuQWM2D4Q0PG0ivyITUIZEC72S1SI5Rp6ZgI8AD_s8V7BktyuK0QMZhSNo/exec", {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    mensaje.textContent = "✅ Actualización enviada (verifica en la hoja)";
    form.reset();
  } catch (error) {
    console.error("Error:", error);
    mensaje.textContent = "❌ Error de conexión";
  }
});

  </script>
</body>
</html>
